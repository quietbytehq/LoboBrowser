<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="#ff6a2b">
  <title>Lobster Browser</title>
  <!-- Flat one-colour mark for the toolbar, throbber and small sizes:
       a globe with a lobster claw cut out, circled by a tilted orbit ring.
       Uses currentColor so the browser theme decides the colour. -->
  <defs>
    <mask id="globe-cut">
      <rect width="64" height="64" fill="#fff"/>
      <g fill="#000">
        <!-- claw: one rounded pincer shape -->
        <path transform="translate(31 28) scale(0.7) translate(-32 -26)" d="M15.5 36 C13.5 25.5 22 14.5 34 12.8 C42.5 11.8 48.5 15.5 48.5 21.5 C48.5 30 40.5 37 30.5 39 C24 40.2 17.5 40 15.5 36 Z"/>
      </g>
      <!-- the opening between the two fingers, open at the tip -->
      <path fill="#fff" transform="translate(31 28) scale(0.7) translate(-32 -26)" d="M28.5 28.5 C33.5 21.5 41 18.8 49 19.3 C44 25.5 36.5 29.2 28.5 28.5 Z"/>
      <!-- gap where the front of the ring passes over the globe -->
      <path d="M2 34 A30 9 0 0 0 62 34" transform="rotate(-18 32 34)"
            fill="none" stroke="#000" stroke-width="8"/>
    </mask>
    <mask id="behind-globe">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="32" r="23.5" fill="#000"/>
    </mask>
  </defs>
  <circle cx="32" cy="32" r="21" mask="url(#globe-cut)"/>
  <g fill="none" stroke="#ff6a2b" stroke-width="3.2" stroke-linecap="round" transform="rotate(-18 32 34)">
    <!-- back of the ring, hidden behind the globe -->
    <path d="M2 34 A30 9 0 0 1 62 34" mask="url(#behind-globe)"/>
    <!-- front of the ring -->
    <path d="M2 34 A30 9 0 0 0 62 34"/>
  </g>
</svg>
